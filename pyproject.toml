[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lambda-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the Lambda Cloud API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lambda-mcp = "lambda_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["lambda_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"spec/lambda-cloud-1.10.0.json" = "lambda_mcp/spec/lambda-cloud-1.10.0.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
